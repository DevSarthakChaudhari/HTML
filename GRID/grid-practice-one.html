<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{
        width: 100vw;
        height: 100vh;
        margin: 0;
        padding: 0;
    }

    .main-container{
        width: 100%;
        height: 100%;
        background-color: rgb(0, 0, 0);
        display: grid;
        grid-template-columns:1fr 1fr ;
    }

    .div-1{
        width: 100%;
        height: 100%;
        background-color:pink; 
    }
    .div-2{
        width: 100%;
        height: 100%;
        background-color:rgb(222, 58, 58); 
    }

    .div-3{
        width: 100%;
        height: 100%;
        background-color:gray; 
    }

    .div-4{
        width: 100%;
        height: 100%;
        background-color:aqua; 
    }
    .div-5{
        width: 100%;
        height: 100%;
        background-color:gray; 
    }

    .div-6{
        width: 100%;
        height: 100%;
        background-color:aqua; 
    }

    .div-7{
        width: 100%;
        height: 100%;
        background-color:rgb(7, 238, 153); 
    }

    .div-8{
        width: 100%;
        height: 100%;
        background-color:rgb(238, 53, 7); 
    }


    </style>
   
</head>
<body>
  <div class="main-container">
    <div class="div-1"></div>
    <div class="div-2"></div>
    <div class="div-3"></div>
    <div class="div-4"></div>
    <div class="div-5"></div>
    <div class="div-6"></div>
    <div class="div-7"></div>
    <div class="div-8"></div>
  </div>
</body>
</html>
