<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive division</title>
    <style>
         body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;

        }

        .container{
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: row;
        }

        .div-1{
            flex-grow: 1;
            background-color: rgb(111, 218, 111);
        }

        .div-2{
            flex-grow: 1;
            background-color: rgb(111, 200, 218);
        }

        .div-3{
            flex-grow: 1;
            background-color: lightcoral;
        }

        @media (max-width:300px){
    .container{
        flex-direction: column;
    }
}
@media  (min-width:1078) and (max-width:1024px){
    .container{
        background-color:rgb(239, 15, 15)
    }
}
    </style>
</head>
<body>
    <div class="container">
        <div class="div-1"></div>
        <div class="div-2"></div>
        <div class="div-3"></div>
    </div>
</body>
</html>
