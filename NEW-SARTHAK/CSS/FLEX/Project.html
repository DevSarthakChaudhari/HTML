<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            background-image: url("https://img.freepik.com/premium-vector/galaxy-background-decorative-seamless-pattern-repeating-background-tileable-wallpaper-print_153302-476.jpg?semt=ais_hybrid&w=740");
            background-size: cover;
            background-repeat:no-repeat ;
        }

        .main-container {
            width: 100%;
            height: 100%;

        }

        .header {
            width: 100%;
            height: 20%;

        }

        span {
            font-size: 70px;
            color: aqua;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            margin-left:40%;
        }

        .mid-card {
            width: 100%;
            height: 40%;
            gap: 15%;
            display: flex;
            margin-left: 60px;
            margin-top:30px ;
        }

        .card-one {
            width: 20%;
            height: 90%;
            background-color: rgb(234, 234, 234);
        }
        .card-two {
            width: 20%;
            height: 90%;
            background-color: rgb(234, 234, 234);
        }
        .card-three {
            width: 20%;
            height: 90%;
            background-color: rgb(234, 234, 234);
        }

        .end-card{
            width: 100%;
            height: 40%;
            gap: 15%;
            display: flex;
            margin-left: 60px;
            margin-top:30px ;
            margin-bottom:40px ;
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="header">
            <span>My Projects</span>
        </div>

        <div class="mid-card">

            <div class="card-one"></div>
            <div class="card-two"></div>
            <div class="card-three"></div>
        </div>

        <div class="end-card">

            <div class="card-one"></div>
            <div class="card-two"></div>
            <div class="card-three"></div>
        </div>
    </div>
</body>

</html>
