<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cument</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container{
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 2/4;
        }
        .box-one{
            width: 80%;
            height: 80%;
            background-color: aqua;
        }

        .box-two{
            width: 40%;
            height: 100%;
            background-color: aqua;
        }

        .box-three{
            width: 80%;
            height: 80%;
            background-color: aqua;
        }

        .box-four{
            width: 80%;
            height: 80%;
            background-color: aqua;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box-one"></div>
        <div class="box-two"></div>
        <div class="box-three"></div>
        <div class="box-four"></div>
        <div class="box-five"></div>
        <div class="box-six"></div>
    </div>
</body>
</html>
