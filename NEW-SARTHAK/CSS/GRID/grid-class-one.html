<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .main-container{
            width: 100%;
            height: 100%;
            background-color: black;
            display: grid;
            grid-template-columns: 1fr 1fr 2fr 1fr;
        }

        .div-1{
            width: 100%;
            height: 100%;
            background-color: rgb(200, 173, 173);
        }

        .div-2{
            width: 100%;
            height: 100%;
            background-color: rgb(205, 16, 16);
        }

        .div-3{
            width: 100%;
            height: 100%;
            background-color: rgb(210, 144, 22);
        }

        .div-4{
            width: 100%;
            height: 100%;
            background-color: rgb(236, 206, 11);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="div-1"></div>
        <div class="div-2"></div>
        <div class="div-3"></div>
        <div class="div-4"></div>

    </div>
</body>
</html>
