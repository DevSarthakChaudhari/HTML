<!DOCTYPE html>
<html lang="en">

<head>
    <title>CSS Class Three</title>
    <style>
        .container-starts {
            width: 100%;
            height: 10cm;
            background-color: lightgrey;
            text-align: center;
        }

        .container {
            width: 100%;
            height: 100px;
            background-color: #5F9DF7;
            color: white;
        }

        .mid-container {
            width: 100%;
            height: 500px;
            background-color: rgb(239, 235, 241);
        }
        .text{
            color: darkgrey;
            font-size: 50px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        .main-text{
            color: lightgray;
            font-size: 100px;
            font-family:Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .last-container {
            width: 100%;
            height: 40px;
            background-color: rgb(11, 171, 239);
        }
    </style>
</head>

<body>

    <!-- Div Starts -->

    <div class="container-starts">
        <div class="container">
            <h1>My Website</h1>
            <p>Welcome to my website layout using div tags!</p>
        </div>

        <!--  Mid Div  -->

        <div class="mid-container">
            <h1 style="color: red;"5>Main Content Area</h1>
            <p>This is where your main content goes.</p>
            <p class="text"> Welcome to my home page</p>
            <p class="main-text">I am developer Sarthak</p>
        </div>

        <!-- Div Ends -->

        <div class="last-container">
            <p>My Website.All rights reserved.</p>
        </div>
    </div>

</body>

</html>
