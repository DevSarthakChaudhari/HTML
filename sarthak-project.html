<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat'n Chill Squad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: #fdf5e6;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
            backdrop-filter: brightness(0.85);
        }

        .container {
            background-color: rgba(0, 0, 0, 0.5); /* semi-transparent for readability */
            padding: 40px;
            max-width: 800px;
            margin: auto;
            border-radius: 10px;
            margin-top: 50px;
        }

        h1.title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        hr {
            border: 1px solid #fdf5e6;
            margin: 20px auto;
            width: 60%;
        }

        .section-title {
            font-size: 1.5em;
            margin-top: 30px;
        }

        .member-list h2 {
            margin-left: 20px;
            font-weight: normal;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1.title {
                font-size: 2em;
            }

            .section-title {
                font-size: 1.3em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Chat'n Chill Squad</h1>
        <hr>

        <div class="captain-section">
            <h1 class="section-title">Captain of the Group:</h1>
            <h2>Dhanush Mankar</h2>
        </div>

        <div class="members-section">
            <h1 class="section-title">Members of the Group:</h1>
            <div class="member-list">
                <h2>Preet Kadwe</h2>
                <h2>Sarthak Chaudhari</h2>
                <h2>Ved Bahekar</h2>
                <h2>Kshitj Badone</h2>
            </div>
        </div>
    </div>
</body>
</html>
