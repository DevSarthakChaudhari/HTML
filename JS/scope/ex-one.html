<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h3>Current Balance:</h3>
    <h3 id="display"></h3>
    <input type="number" id="input" placeholder="">
    <button onclick="myFunctionTwo()">Submit</button>
    <script>

        let balance = 10000;
        document.getElementById("display").innerHTML = balance;
        function myFunctionTwo() {
            let amount = document.getElementById("input").value;
            balance = balance - Number(amount)
            document.getElementById("display").innerHTML = balance;
        }

    </script>
</body>

</html>
