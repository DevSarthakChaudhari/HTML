      .product-image{

        height: 8%;
        background-color: rgb(14, 230, 39);
      }

        width: 45%;
        height: 90%;
        background-color:purple;
      }

</head>

<body>
    <div class="main-container">

        <div class="product-large-image">
            <div class="product-large-image">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTJNBmPMFHR6g5Prmz4SAUbaa3lCTSpK-irLg&s"
                width="100%" height="100%">

</html>
