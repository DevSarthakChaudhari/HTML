<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
        }

        .main-container {
            width: 100%;
            height: 100%;
        }

        .top-container {
            width: 100%;
            height: 20%;
            background-color: aqua;
        }

        .header {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 50px;
        }

        .footer {
            width: 100%;
            height: 50%;
            background-color: blueviolet;
            display: flex;
            flex-direction: row;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
        }

        .box {
            width: 15%;
            height: 80%;
            background-color: rgb(158, 154, 154);
        }

        .box-one {
            height: 20%;
            width: 100%;
            background-color: rgb(15, 3, 65);
            align-content: center;
        }

        .heading {
            width: 100%;
            height: 100%;
            text-align: center;
            font-size: 25px;
            margin-left: 50px;
            color: white;
        }

        .box-two {
            height: 80%;
            width: 100%;
            background-color: rgb(235, 239, 241);

        }

        .one {
            width: 100%;
            height: 100%;
            font-size: 30px;
        }

        .two {
            width: 90%;
            height: 20%;
            background-color: lightgray;
            margin-top: 10px;
            font-size: 20px;

        }

        .three{
            width: 90%;
            height: 20%;
            background-color: lightgray;
            margin-top: 10px;
            font-size: 20px;
        }
        .four{
            width: 90%;
            height: 20%;
            background-color: lightgray;
            margin-top: 10px;
            font-size: 20px;
        }
    </style>
</head>

<body>
    <!--  -->
    <div class="main-container">
        <!-- top-container -->
        <div class="top-container">
            <div class="header">Weekly Calender</div>
        </div>
        <!-- footer -->
        <div class="footer">
            <div class="box">
                <div class="box-one">
                    <span class="heading">Sunday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 5
                        <div class="two">Brunch with family-11 Am</div>
                    </div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Monday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 6
                        <div class="two">Team meeting 10 AM</div>
                        <div class="three"> Project deadline-5 PM</div>
                        <div class="four">Gym-7 PM</div>
                    </div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Tuesday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 7
                        <div class="two">Doctor's appoinmenent 5 PM</div>
                        <div class="three">Client call-4 PM</div>
                    </div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Wednesday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 8
                        <div class="two">Workshop-all day</div>
                    </div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Thursday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 9
                        <div class="two">Standup meeting-9.30 AM</div>
                    </div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Friday</span>
                </div>
                <div class="box-two">
                    <div class="one"> May 11</div>
                </div>
            </div>
            <div class="box">
                <div class="box-one">
                    <span class="heading">Saturday</span>
                </div>
                <div class="box-two">
                    <div class="one">May12</div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
