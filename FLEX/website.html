<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

      
        .main-container {
            width: 100%;
            height: 100%;
            background-color: aqua;
        }

        .header{
            width: 100%;
            height: 10%;
            background-color: #ffff;
            display: flex;
        }

        .head-1{
            width: 50%;
            height: 100%;
            background-color: #ffff;
        }

        button{
            margin-top: 20px;
            width: 30%;
            height: 50%;
            background-color: black;
            color: #ffff;
            font-size: 20px;
            border-radius: 30px;
            margin-left: 20px;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }

        .head-2{
            width: 50%;
            height: 100%;
            background-color: #ffff;
        }

    </style>
</head>
<body>
   <div class="main-container">
    <div class="header">
        <div class="head-1">  
            <button>Lovers Magazine</button>
        </div>
        <div class="head-2"></div>
    </div>
   </div>
</body>
</html>
