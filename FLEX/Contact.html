<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sarthak Contact</title>
  <style>
    body {
      width: 100vw;
      height: 100vh;
      margin: 0;
      padding: 0;
      background-image: url("https://img.freepik.com/premium-vector/galaxy-background-decorative-seamless-pattern-repeating-background-tileable-wallpaper-print_153302-476.jpg?semt=ais_hybrid&w=740");
    }

    .starter {
      width: 100%;
      height: 100%;

    }

    .header {
      width: 100%;
      height: 15%;
      margin-top: 50px;
    }

    .mid {
      width: 100%;
      height: 25%;
      display: flex;
      gap: 20%;
      margin-left: 90px;
      margin-top: 5%;
    }

    .one {
      width: 15%;
      height: 100%;
      background-color: rgb(0, 0, 0);
      border-radius: 40px;
      color: #ffff;
    }

    .end {
      width: 100%;
      height: 25%;
      display: flex;
      gap: 20%;
      margin-left: 25%;
      margin-top: 5%;
    }

    button {
      width: 100px;
      height: 30px;
      margin-left: 60px;
      border-radius: 10px;
      margin-bottom: 50px;
    }

    a {
      text-decoration: none;
      color: black;
      font-size: 15px;
      margin-top: 15%;
    }
  </style>
</head>

<body>
  <div class="starter">
    <div class="header">
      <h2 style="font-size: 25px; margin-left: 70px; color: gray;"> CONTACT <span style="color: aqua;">
          _________
        </span> </h2>

      <h1 style="font-size: 40px;  margin-left: 70px;color: #ffff;">
        Contact Me
      </h1>
    </div>

    <!-- Card -->

    <div class="mid">

      <!-- EMAIL -->
      <div class="one">
        <span style="font-size: 50px;
            margin-left: 90px;">📨</span>
        <h1 style="margin-top: 15%; margin-left: 65px;">Email</h1>

        <button> <a href="email.html">Email </a></button>

      </div>

      <!-- PHONE -->

      <div class="one">
        <span style="font-size: 50px;
            margin-left: 85px;">📞</span>
        <h1 style="margin-top: 15%; margin-left: 60px;">Phone</h1>
        <button> <a href="phone.html">Phone</a></button>
      </div>


      <!-- GIT HUB -->
      <div class="one">

        <span style="font-size: 50px;
              margin-left: 85px;">💻</span>
        <h1 style="margin-top: 15%; margin-left: 60px;">Git Hub</h1>

        <button> <a href="github.html">Git Hub</a></button>
      </div>
    </div>

    <div class="end">
      <div class="one"> 
        <h1 style="margin-top: 15%; margin-left: 65px; font-size: 45px; color: aqua; margin-top: 40%;">Thank</h1>
      </div>
      <div class="one">
        <h1 style="margin-top: 15%; margin-left: 65px; font-size: 45px;color: aqua;  margin-top: 40%">You</h1>
      </div>
    </div>
  </div>

</html>
