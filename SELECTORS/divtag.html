<!DOCTYPE html>
<html>

<head>
    <title>div tag in html</title>
    <style>
        .box-one {
            width: 300px;
            height: 300px;
            background-color: rgb(245, 9, 202);
        }
    </style>
</head>

<body>
    <div style="width: 500px; height: 500px; background-color: lightblue;">
        <div style="width: 400px; height: 100px; background-color: blue;"></div>
        <div style="width: 400px; height: 100px; background-color: red;"></div>
        <div style="width: 400px; height: 100px; background-color: yellow;"></div>
    </div>

    <!-- second div -->
    <div class="box-one"></div>

    <!-- third div -->
    <div class="box-one"></div>

</body>

</html>
