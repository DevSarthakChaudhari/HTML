<!DOCTYPE html>
<html lang="en">
<head>
    <title>Colspan In Tabel</title>
    <style>
        table{
            width: 100%;
            height: 800px;
            Background-color: #121111;
        }
        td{
            background-color: #F1F0E9;
        }
    </style>
</head>
<body>
   <table>

    <!-- Row One -->

     <tr>
        <td colspan="5"></td>
        <td></td>
     </tr>

     <!-- Row Two -->

     <tr>
        <td colspan="3"></td>

        <td></td>

        <td colspan="2" ></td>
     </tr>

     <!-- Row Three -->
     <tr>
        <td></td>
        <td colspan="5"></td>
     </tr>

     <!-- Row Four -->

     <tr>
        <td></td>
        <td ></td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        </tr>
</body>
</html>
