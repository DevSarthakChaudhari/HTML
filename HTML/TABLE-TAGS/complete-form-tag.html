<html >        
<head>
    <title>Complete form tag in html</title>
</head>
<body>
   <form>
    <!--Personal section-->
    <fieldset>
        <legend>Personal Details</legend>
        <label>Enter your name :</label>
        <input type="text">
        <br>
        <label>Enter your email:</label>
        <input type="email">
        <br>
        <label>Enter your date of birth:</label>
        <input type="date">
        <br>
    </fieldset>

    <!--Contact section-->
    <fieldset>
        <legend>Contact details</legend>
        <label>Enter your mobile number</label>
        <input type="number">
        <br>
        <br>
        <label> enter your adress:</label>
        <textarea></textarea>
    </fieldset>

    <!--Option section-->
    <fieldset>
        <legend>Other details</legend>
        <label>Choose your system</label>
        <select>
            <!-- group one-->
            <optgroup label="Opreating system">
            <option>Windows</option>
            <option>Linux</option>
            <option>Mac</option>
            </optgroup>
            <!-- group two-->
             <optgroup label="Opreating System">
                <option>Android</option>
                <option>IOS</option>
             </optgroup>
            
        </select>
    </fieldset>

    <!--Submit section-->
    <fieldset>
        <legend>Submit</legend>
        <input type="submit" value="Submit">
        <input type="reset" value="reset">
    </fieldset>
   </form> 
</body>
</html>
