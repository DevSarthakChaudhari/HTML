<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
           body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;

        }

        .main-container{
            width: 100%;
            height: 70%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }
        /* Row one*/
        .box-1{
            width:100%;
            height: 30%;
            background-color: #14f0e5;
            display: flex;
            gap:20px;
        }
        .div-1{
            background-color:rgb(47, 45, 45) ;
            flex-grow: 1;
        }

        .div-2{
            background-color:rgb(47, 45, 45) ;
            flex-grow:1;
        }

        .div-3{
            background-color:rgb(47, 45, 45) ;
            flex-grow:1;
}

        .box-2{
            width:100%;
            height: 30%;
            background-color: #14f0e5;
            display: flex;
            gap: 30px;
        }
        .div-2-1{
            background-color:rgb(47, 45, 45) ;
            flex-grow:2.5;
        }
        .div-2-2{
            background-color:rgb(47, 45, 45) ;
            flex-grow:1;
        }
        .div-2-3{
            background-color:rgb(47, 45, 45) ;
            flex-grow:4;
        }

        .box-3{
            width: 100%;
            height: 30%;
            background-color: #14f0e5;
        }

        .three{
            background-color:rgb(47, 45, 45) ;
            flex-grow:1;
        }

    </style>
</head>
<body>
<div class="main-container">
        <div class="box-1">
           <div class="div-1"></div>
           <div class="div-2"></div>
           <div class="div-3"></div>
        </div>
        <div class="box-2">
            <div class="div-2-1"></div>
           <div class="div-2-2"></div>
           <div class="div-2-3"></div>
        </div>
        <div class="box-3">
            <div class="three"></div>
            <div class="three"></div>
            <div class="three"></div>
        </div>
    </div>
</body>
</html>
