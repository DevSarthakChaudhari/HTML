<!DOCTYPE html>
<html lang="en">
<head>
    <title>Flex child proporties</title>
    <style>
        body{
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        .main-container{
            width: 100%;
            height: 100%;
            display: flex;
            gap: 20px;
        }

        .box-1{
            width:200px;
            height:200px;
            align-self: center;
            background-color: #14f0e5;
        }

        .box-2{
            width:200px;
            height:200px;
            background-color: blue;
            flex-shrink: 3;
            flex-grow: 1;
        }

        .box-3{
            width:200px;
            height:200px;
            background-color:purple;
            flex-shrink: 4;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="box-1"></div>
        <div class="box-2"></div>
        <div class="box-3"></div>
    </div>
</body>
</html>
