<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sarthak Chaudhari Portfolio</title>
  <style>
    *{
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
      color: #fff;
      background: url(https://images.unsplash.com/photo-1510519138101-570d1dca3d66?fm=jpg&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8ZGFyayUyMG9mZmljZXxlbnwwfHwwfHx8MA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000)
        no-repeat center center/cover;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: -1;
    }

    .main-container {
      width: 100%;
      height: 100%;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 10%;
      background-color: #272727cc;
      padding: 0 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
    }

    .header {
      display: flex;
      gap: 30px;
    }

    .header a {
      color: #fff;
      font-size: 18px;
      text-decoration: none;
      transition: color 2.0 ease;
      margin-left: 40px;
    }

    .header a:hover {
      color: aqua;              
    }

    .mid-container {
      height: 90%;
      display: flex;
      align-items: center;
      padding-left: 50px;
    }

    .text h2 {
      font-size: 24px;
      margin: 0;
    }

    .text h1 {
      font-size: 48px;
      color: aqua;
      margin: 10px 0;
    }

    .text h3 {
      font-size: 28px;
      margin-top: 20px;
    }

    .text p {
      margin-top: 20px;
      font-size: 20px;
      max-width: 600px;
    }

    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        height: 200px;
        padding: 10px;
      }

      .header {
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
      }

      .text h1 {
        font-size: 40px;
      }

      .text h3,
      .text h2,
      .text p {
        font-size: 20px;
      }

      .mid-container {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>
  <div class="main-container">
    <!-- Header Section -->
    <div class="header">
      <h1>Sarthak Chaudhari</h1>
      <div class="header">
        <a href="./portfolio-home-page.html">Home</a>
        <a href="./about.html">About</a>

        <a href="./Project.html">Project</a>
        <a href="./Contact.html">Contact</a>
      </div>
    </div>

    <!-- Mid Section -->
    <div class="mid-container">
      <div class="text">
        <h2>Hi, I'm</h2>
        <h1>Sarthak Chaudhari</h1>
        <h3>Full-Stack Developer</h3>
        <p>
          “A designer knows he has achieved perfection not when there is nothing left to add,
          but when there is nothing left to take away.”
        </p>
      </div>
    </div>
  </div>
</body>

</html>
