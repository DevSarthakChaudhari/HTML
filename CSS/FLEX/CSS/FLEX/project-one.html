<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .main-container {
            width: 100%;
            height: 100%;

        }

        .header {
            width: 100%;
            height: 10%;
            display: flex;
        }

        .first-header {
            width: 50%;
            height: 100%;
            background-color: #332D56;

        }

        span {
            font-size: 50px;
        }

        .child-header {
            display: flex;
            margin-left: 25px;
            color: #ffff;
        }

        .second-header {
            width: 50%;
            height: 100%;
            background-color:#332D56;
            color: #ffff;
        }

        .names {
            display: flex;
            font-size: 150%;
            gap: 30px;
            margin-left: 200px;
        }

        .mid-container {
            width: 100%;
            height: 80%;

            display: flex;

        }

        .side-container {
            width: 20%;
            height: 150%;
            background-color:#332D56;
            color: #ffff;
        }
        
        h3
        {
            margin-left:10%;

        }

        h1{
            margin-left:10%;
        }

        .last-container {
            width: 80%;
            height: 150%;

        }


        .last{
            width: 90%;
            height: 60%;
            margin-left: 5%;
            margin-top: 5%;
        }

        .last-heading{
            width: 100%;
            height: 15%;
            color: #7965C1;
        }


        .last-body{
            width: 100%;
            height: 85%;
            color: #7965C1;
        }
      table{
        width: 100% ;
        height: 90%;
      }

        .box-1{
           width: 100px;
           height: 60px;
           background-color: #E8F9FF;
        }
        .box-2{
            width: 60px;
           height: 60px;

        }
        .box-3{
            width: 60px;
           height: 60px;

        }
        .box-4{
            width: 60px;
           height: 60px;

           margin-left: 50%;
        }
        .box-5{
            width: 60px;
           height: 60px;

        }
        .box-6{
            width: 60px;
           height: 60px;
        }
    </style>
</head>

<body>

    <!-- Main contaoner starts  -->
    <div class="main-container">

        <!-- Header Starts -->
        <div class="header">
            <div class="first-header">
                <div class="child-header">
                    <span>🎓</span>
                    <h1>Student Portel</h1>
                </div>
            </div>
            <div class="second-header">
                <div class="names">
                    <p>Dashboard</p>
                    <p>Reports</p>
                    <p>Settings</p>
                    <p>Logout</p>
                </div>
            </div>
        </div>


        <div class="mid-container">
            <div class="side-container">
                <h1>Menu</h1>
                <h3>Overvives</h3>
                <h3>My Cources</h3>
                <h3>Assignment</h3>
                <h3>Performance</h3>
                <h3>Profile</h3>
            </div>

            <div class="last-container">
                <div class="last">
                    <div class="last-heading">
                        <h1>Student Score</h1>
                    </div>
                    <div class="last-body">
                        <table>
                            <tr class="box-1">
                                <td>Name </td>
                                <td> Subjects</td>
                                <td> Marks </td>
                                <td> Grade</td>
                            </tr>
                            <tr class="box-2">
                                <td> Aarav Sharma </td>
                                <td> Mathematics</td>
                                <td> 92</td>
                                <td> A</td>
                            </tr>
                            <tr class="box-3">
                                <td> Isha Patel </td>
                                <td> Science</td>
                                <td> 88</td>
                                <td>B+</td>
                            </tr>
                            <tr class="box-4">
                                <td>Rahul Verma</td>
                                <td> English</td>
                                <td>76</td>
                                <td>B</td>
                            </tr>
                            <tr class="box-5">
                                <td>Priya Singh</td>
                                <td> Social Studies</td>
                                <td>81</td>
                                <td>B+</td>
                            </tr>
                            <tr class="box-6">
                                <td>Devika Joshi</td>
                                <td>Hindi</td>
                                <td>95</td>
                                <td>A+</td>
                            </tr>
                        
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
