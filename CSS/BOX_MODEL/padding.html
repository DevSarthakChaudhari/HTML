<!DOCTYPE html>
<html lang="en">
<head>
    <title>Padding in html</title>
    <style>

        /* Css starts */
        .first{
            background-color:aqua;
            width: 600px;
            height: 600px;
        }
        /* Second section starts */
        .second{
            background-color: crimson;
            width: 150px;
            height: 150px;
           border-style: solid;
            border-color:black;
            border-width: 3px;
            margin-left: 200px; 
            padding-left: 100px;
            padding-top: 200px;
        }

        /* Css ends */
    </style>
</head>
<body>
    <!-- Div starts -->
   <div class="first">
    <!-- Second div starts -->
    <div class="second"></div>
   </div> 
</body>
</html>
